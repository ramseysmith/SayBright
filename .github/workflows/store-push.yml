name: Store listing

# Pushes store.config.json to App Store Connect whenever it changes on main, so
# listing work merged by an agent goes live without anyone at a Mac.
# Needs repo secrets EXPO_TOKEN (an Expo robot or personal access token) and
# STORE_REVIEW_PHONE. EAS uses the App Store Connect API key already stored in
# the project's EAS credentials.

on:
  push:
    branches: [main, master]
    paths: [store.config.json]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    # 18 screenshots plus deleting the old set took over 15 minutes (CelebriDay 1.6.0, Oct 22)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip when the token is missing
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set, so the listing was not pushed. See HQ SETUP.md."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.skip != '1' && hashFiles('bun.lock') != ''
      - name: Install
        if: steps.gate.outputs.skip != '1'
        run: |
          if [ -f bun.lock ]; then bun install --frozen-lockfile; else npm ci --ignore-scripts; fi
      - name: Push listing
        if: steps.gate.outputs.skip != '1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          STORE_REVIEW_PHONE: ${{ secrets.STORE_REVIEW_PHONE }}
        # The result is also written as an annotation, because cloud sessions can
        # read annotations through the API but not the raw log. Only screenshot
        # sizes listed in store.config.json are replaced; list every size the
        # version has (medium and large iPhone at least) or old ones stay.
        run: |
          set +e
          npx --yes eas-cli@latest metadata:push --non-interactive > out.txt 2>&1
          code=$?
          cat out.txt
          msg=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' out.txt | grep -v '^\s*$' | tail -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ "$code" -eq 0 ]; then echo "::notice title=Store listing::$msg"; else echo "::error title=Store listing::$msg"; fi
          exit "$code"
