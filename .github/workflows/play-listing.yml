name: Play listing

# Publishes play.config.json (text and images) to Google Play whenever it
# changes on main, so Android listing work merged by an agent goes live without
# anyone at a Mac. Needs the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repo secret (the
# same key EAS Submit uses). Skips quietly until the secret exists.
# Synced from HQ (templates/app/.github/workflows). Change it there.

on:
  push:
    branches: [main, master]
    paths: [play.config.json, 'store/google/**']
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check
        run: node scripts/android/play-listing.mjs --check
      - name: Push
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set, so the Play listing was not pushed. See HQ docs/android.md."
            exit 0
          fi
          node scripts/android/play-listing.mjs --push
