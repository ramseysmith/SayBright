name: Store listing pull

# Run once by hand (Actions, Store listing pull, Run workflow) to create
# store.config.json from the live App Store listing, so agents can edit it and
# store-push.yml can publish their changes. Needs the EXPO_TOKEN repo secret.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: hashFiles('bun.lock') != ''
      - name: Install
        run: |
          if [ -f bun.lock ]; then bun install --frozen-lockfile; else npm ci --ignore-scripts; fi
      - name: Pull listing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest metadata:pull --non-interactive
      - name: Commit
        run: |
          git config user.name "Ramsey Graysmith"
          git config user.email "smith.s.ramsey@gmail.com"
          git add store.config.json
          git diff --cached --quiet || git commit -m "Pull the live App Store listing into store.config.json"
          git push
