<!doctype html><html><head><meta charset="utf-8"><style>
/* Store screenshot only: SayBright's real home screen widgets (systemLarge and
   systemMedium in targets/widget/index.swift) on an iPhone home screen. */
*{margin:0;box-sizing:border-box}
body{width:440px;height:956px;overflow:hidden;font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;
background:linear-gradient(170deg,#FFC56E 0%,#FF9F7A 45%,#F2789A 80%,#B25A9E 100%);position:relative}
.status{position:absolute;top:16px;left:34px;right:30px;display:flex;justify-content:space-between;font:600 16px -apple-system,"Inter",sans-serif;color:#2A1E45}
.w{position:absolute;left:26px;right:26px;background:#FFFDFB;border-radius:26px;box-shadow:0 12px 30px rgba(90,30,60,.18);color:#1C1530}
.large{top:70px;height:388px;padding:22px}
.medium{top:484px;height:182px;padding:18px}
.row{display:flex;align-items:center;gap:8px}
.cat{font-size:15px;font-weight:600;color:#6E6684}
.streak{margin-left:auto;font-size:15px;font-weight:600}
.big{margin-top:30px;font:700 30px/1.25 "New York","Georgia",serif}
.mid{margin-top:14px;font:600 21px/1.28 "New York","Georgia",serif}
.foot{position:absolute;left:22px;right:22px;bottom:20px;display:flex;justify-content:space-between;font-size:14px}
.brand{font-weight:700;color:#F5A623}
.sec{color:#8C849E;font-size:13px}
.label{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:#2A1E45;opacity:.8}
.dock{position:absolute;left:14px;right:14px;bottom:22px;height:96px;border-radius:34px;background:rgba(255,255,255,.28)}
.dots{position:absolute;bottom:132px;left:0;right:0;text-align:center;color:#2A1E45;opacity:.6;letter-spacing:6px}
</style></head><body>
<div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
<div class="w large"><div class="row"><span style="font-size:22px">&#127749;</span><span class="cat">Morning Energy</span><span class="streak">&#128293; 12 day streak</span></div>
<div class="big">This morning I choose presence over the urge to rush.</div>
<div class="foot"><span class="brand">SayBright</span><span class="sec">Tap to open</span></div></div>
<div class="label" style="top:464px">SayBright</div>
<div class="w medium"><div class="row"><span style="font-size:18px">&#9728;&#65039;</span><span class="cat" style="font-size:13px">Confidence</span><span class="streak" style="font-size:13px">&#128293; 12</span></div>
<div class="mid">I stand tall in who I am becoming each day.</div>
<div class="foot" style="bottom:16px;left:18px"><span class="brand" style="font-size:12px">SayBright</span></div></div>
<div class="label" style="top:672px">SayBright</div>
<div class="dots">&#8226;&#8226;</div><div class="dock"></div>
</body></html>
