<!doctype html><html><head><meta charset="utf-8"><style>
/* Store screenshot only: SayBright's real lock screen widget (accessoryRectangular in
   targets/widget/index.swift) and its real morning reminder (src/services/notifications.ts)
   on an iPhone lock screen. Rendered by make.py for the scene with "mock". */
*{margin:0;box-sizing:border-box}
body{width:440px;height:956px;overflow:hidden;font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif;color:#fff;
background:linear-gradient(175deg,#FFB25E 0%,#FF8F72 38%,#E8698F 70%,#7A4AA0 100%);position:relative}
.sun{position:absolute;left:50%;top:560px;width:330px;height:330px;margin-left:-165px;border-radius:50%;
background:radial-gradient(circle,#FFE2A0 0%,#FFC77A 45%,rgba(255,199,122,0) 72%);opacity:.85}
.hill{position:absolute;left:-10%;right:-10%;bottom:-40px;height:330px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(122,74,160,.55),rgba(60,30,90,.9))}
.status{position:absolute;top:16px;left:34px;right:30px;display:flex;justify-content:space-between;font:600 16px -apple-system,"Inter",sans-serif}
.lock{position:absolute;top:58px;left:0;right:0;text-align:center;font-size:15px;opacity:.9}
.date{position:absolute;top:96px;left:0;right:0;text-align:center;font-size:21px;font-weight:600;opacity:.92}
.time{position:absolute;top:118px;left:0;right:0;text-align:center;font-size:112px;font-weight:600;letter-spacing:-3px;line-height:1.05}
.widget{position:absolute;top:262px;left:44px;right:44px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px)}
.wtop{font-size:15px;font-weight:700;opacity:.95}
.wtext{margin-top:4px;font:600 19px/1.25 "New York","Georgia",serif}
.note{position:absolute;left:14px;right:14px;bottom:146px;padding:14px 16px;border-radius:24px;background:rgba(255,248,242,.82);color:#2A1E45;display:flex;gap:12px;box-shadow:0 10px 30px rgba(60,20,60,.18)}
.note img{width:40px;height:40px;border-radius:10px}
.nb{flex:1}
.nh{display:flex;justify-content:space-between;font-size:16px}
.nh b{font-weight:700}
.nh span{color:rgba(42,30,69,.6);font-size:14px}
.nt{margin-top:3px;font:600 18px/1.3 "New York","Georgia",serif}
.bottom{position:absolute;bottom:40px;left:52px;right:52px;display:flex;justify-content:space-between}
.btn{width:50px;height:50px;border-radius:25px;background:rgba(40,20,50,.32)}
.bar{position:absolute;bottom:10px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff}
</style></head><body>
<div class="sun"></div><div class="hill"></div>
<div class="status"><span></span><span>&#9679;&#9679;&#9679;</span></div>
<div class="lock">&#128274;</div>
<div class="date">Thursday, November 12</div>
<div class="time">8:00</div>
<div class="widget"><div class="wtop">&#128150; SayBright</div><div class="wtext">I treat myself with the kindness I offer my closest friends.</div></div>
<div class="note"><img src="ICON"><div class="nb"><div class="nh"><b>&#9728;&#65039; Your affirmation is ready</b><span>now</span></div>
<div class="nt">I trust myself to make the right decisions for my life.</div></div></div>
<div class="bottom"><div class="btn"></div><div class="btn"></div></div><div class="bar"></div>
</body></html>
